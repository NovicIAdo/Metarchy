# Debug APK on demand: bundles the client in mobile mode (assets local, game
# traffic to staging) inside the Capacitor Android shell. The artifact installs
# on any device with "install unknown apps" enabled — no store account needed.
# Release/Play builds (signing, AAB) come with the Google Play account.

name: Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @metarchy/client exec vite build --mode mobile
      - run: pnpm --filter @metarchy/client exec cap sync android
      - run: cd apps/client/android && ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: metarchy-debug-apk
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
